server {
    listen 80;
    listen [::]:80;
    server_name teamfarias.nabio.pro;
    access_log /var/www/apps/teamfarias/shared/logs/nginx-access.log;
    error_log /var/www/apps/teamfarias/shared/logs/nginx-error.log;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/apps/teamfarias/shared/acme;
        try_files $uri =404;
    }
    # Somente durante o provisionamento, antes da validação do HTTPS.
    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
