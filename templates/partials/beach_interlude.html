{% load static %}
<div class="beach-interlude shell">
  <div class="beach-interlude__copy">
    <p class="eyebrow">A energia da nossa quadra</p>
    <p class="beach-interlude__title">Pé na areia.<br><em>Cabeça no jogo.</em></p>
  </div>
  <div class="beach-interlude__flight" aria-hidden="true">
    <span class="ball-orbit"></span>
    <img src="{% static 'img/beach-ball.svg' %}" width="220" height="220" alt="" loading="lazy" decoding="async">
    <span class="beach-interlude__stamp">{{ site.city }} / {{ site.state }}</span>
  </div>
</div>
