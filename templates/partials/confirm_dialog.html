<dialog id="action-confirm" class="action-confirm management-dialog" aria-labelledby="action-confirm-title" aria-describedby="action-confirm-message">
  <div class="dialog__head"><h2 id="action-confirm-title">Confirmar alteração</h2><button class="icon-btn" type="button" data-confirm-cancel aria-label="Fechar confirmação"><svg class="icon"><use href="#i-x"></use></svg></button></div>
  <div class="dialog__body"><p id="action-confirm-message" data-confirm-message></p></div>
  <div class="dialog__foot"><button class="btn btn--ghost" type="button" data-confirm-cancel>Cancelar</button><button class="btn btn--primary" type="button" data-confirm-accept>Confirmar</button></div>
</dialog>
