limit_req_zone $binary_remote_addr zone=teamfarias_login:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name teamfarias.nabio.pro;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/apps/teamfarias/shared/acme;
        try_files $uri =404;
    }
    location / { return 301 https://teamfarias.nabio.pro$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name teamfarias.nabio.pro;
    ssl_certificate /etc/letsencrypt/live/teamfarias.nabio.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teamfarias.nabio.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:teamfarias_tls:1m;
    ssl_session_timeout 1d;
    server_tokens off;
    client_max_body_size 10m;
    access_log /var/www/apps/teamfarias/shared/logs/nginx-access.log;
    error_log /var/www/apps/teamfarias/shared/logs/nginx-error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    location ~ /\. { deny all; }
    location /static/ {
        alias /var/www/apps/teamfarias/shared/staticfiles/;
        expires 1h;
        access_log off;
    }
    # Fotos validadas e reprocessadas pelo cadastro de produtos.
    location ~ "^/media/products/([a-f0-9]{32}\.webp)$" {
        alias /var/www/apps/teamfarias/shared/media/products/$1;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Disposition inline always;
        expires 1h;
    }
    location /media/ {
        alias /var/www/apps/teamfarias/shared/media/;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Disposition attachment always;
    }
    location ~ ^/(entrar/|admin/login/) {
        limit_req zone=teamfarias_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_redirect off;
    }
}
